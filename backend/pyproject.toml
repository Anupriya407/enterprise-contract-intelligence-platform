[project]
name = "ecip-backend"
version = "0.1.0"
description = "Enterprise Contract Intelligence Platform Backend"
requires-python = ">=3.11,<3.12"

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "sqlalchemy",
    "psycopg[binary]",
    "alembic",
    "python-dotenv",
    "python-multipart",
    "paddleocr==2.10.0",
    "paddlepaddle==2.6.2",
    "pymupdf",
    "pillow",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"